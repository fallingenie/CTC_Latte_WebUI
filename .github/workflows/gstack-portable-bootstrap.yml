name: Build portable gstack bootstrap

on:
  push:
    branches:
      - tmp/gstack-bootstrap-20260805
    paths:
      - .github/workflows/gstack-portable-bootstrap.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trigger repository
        uses: actions/checkout@v4

      - name: Clone gstack shallowly
        run: git clone --single-branch --depth 1 https://github.com/garrytan/gstack.git "$HOME/gstack"

      - name: Install pinned Bun
        shell: bash
        run: |
          set -euo pipefail
          BUN_VERSION=1.3.10
          curl -fsSL https://bun.sh/install -o /tmp/install-bun.sh
          BUN_INSTALL="$HOME/.bun" BUN_VERSION="$BUN_VERSION" bash /tmp/install-bun.sh
          "$HOME/.bun/bin/bun" --version

      - name: Build gstack and provision runtime
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          cd "$HOME/gstack"
          GSTACK_SKIP_FONTS=1 ./setup -q --no-team --no-plan-tune-hooks 2>&1 | tee "$HOME/gstack-setup-actions.log"
          test -x "$HOME/gstack/browse/dist/browse"
          test -d "$HOME/gstack/node_modules"
          test -d "$HOME/.cache/ms-playwright"

      - name: Package portable bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          tar --zstd -C "$HOME" -cf "$GITHUB_WORKSPACE/out/gstack-portable.tar.zst" \
            gstack \
            gstack-setup-actions.log \
            .bun/bin/bun \
            .bun/install/cache \
            .cache/ms-playwright
          sha256sum "$GITHUB_WORKSPACE/out/gstack-portable.tar.zst" | tee "$GITHUB_WORKSPACE/out/SHA256SUMS"
          du -h "$GITHUB_WORKSPACE/out/gstack-portable.tar.zst"

      - name: Upload portable bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: gstack-portable-linux-x64
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
