steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - frontend/deploy/Dockerfile.legacy-rc
      - --tag
      - '${_IMAGE}'
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - --entrypoint
      - /bin/sh
      - '${_IMAGE}'
      - -ec
      - |
        node --version
        python3 --version
        python3 -c "import fsspec, gcsfs, numpy, pandas, pyarrow, xarray, zarr"
        python3 -c "import sys; sys.path.insert(0, '/app/backend'); import Climate_Time_Capsule_app.services.exporting.web_query_service"
        id -u | grep -qx 10001
        id -g | grep -qx 10001
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_IMAGE}'
images:
  - '${_IMAGE}'
